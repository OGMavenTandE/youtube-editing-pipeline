[project]
name = "ytp"
version = "0.1.0"
description = "Script-driven local YouTube editing pipeline for the Scott Mastin channel"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["pyyaml>=6"]

[project.optional-dependencies]
whisper = ["faster-whisper>=1.1.0,<1.3", "av>=16.1.0,<17"]
dev = ["pytest>=8", "ruff>=0.6"]

[project.scripts]
ytp = "ytp.cli:main"

[tool.setuptools.packages.find]
include = ["ytp*"]

[tool.pytest.ini_options]
markers = [
  "whisper: loads faster-whisper and may download a model; CI excludes these with -m 'not whisper'",
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "W"]
