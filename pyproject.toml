[project]
name = "ytp"
version = "0.1.0"
description = "Script-driven local YouTube editing pipeline for the Scott Mastin channel"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["pyyaml>=6", "Pillow>=10"]

[project.optional-dependencies]
# On Windows the CUDA 12 runtime comes from NVIDIA's wheels: ctranslate2 4.x needs
# cublas64_12.dll and cuDNN 9. ytp adds their bin folders to the DLL search path.
whisper = [
  "faster-whisper>=1.1.0,<1.3",
  "av>=16.1.0,<17",
  "yt-dlp>=2025.1.15",
  "nvidia-cublas-cu12>=12.4,<13; sys_platform == 'win32'",
  "nvidia-cudnn-cu12>=9.1,<10; sys_platform == 'win32'",
]
# `ytp transcribe` downloads public posts with yt-dlp. Included in [whisper] too.
transcribe = ["yt-dlp>=2025.1.15"]
# `ytp art`: local image generation. Install a CUDA torch wheel first (docs/art-jobs.md).
art = [
  "torch>=2.4",
  "diffusers>=0.31",
  "transformers>=4.44",
  "accelerate>=0.33",
  "safetensors>=0.4",
  "rembg>=2.0.59",
  "onnxruntime>=1.18",
]
dev = ["pytest>=8", "ruff>=0.6"]

[project.scripts]
ytp = "ytp.cli:main"

[tool.setuptools.packages.find]
include = ["ytp*"]

[tool.pytest.ini_options]
markers = [
  "whisper: loads faster-whisper and may download a model; CI excludes these with -m 'not whisper'",
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "W"]
