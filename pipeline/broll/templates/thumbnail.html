<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>thumbnail</title>
  <style>
    html, body {
      width: 1280px;
      height: 720px;
      margin: 0;
      overflow: hidden;
      font-family: "DejaVu Sans", "Segoe UI", Arial, sans-serif;
      color: #f4f7fb;
      background: #0b1016;
    }
    .title-wrap {
      position: absolute;
      left: 56px;
      top: 72px;
      width: 620px;
    }
    .eyebrow {
      margin: 0 0 18px;
      font-size: 22px;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      color: #38bdf8;
      font-weight: 700;
    }
    h1 {
      margin: 0;
      font-size: 56px;
      line-height: 1.12;
      letter-spacing: -0.02em;
      font-weight: 700;
    }
    .rule {
      margin-top: 28px;
      width: 120px;
      height: 8px;
      border-radius: 4px;
      background: #38bdf8;
    }
    .webcam {
      position: absolute;
      right: 48px;
      top: 56px;
      width: 520px;
      height: 608px;
      border-radius: 22px;
      overflow: hidden;
      box-sizing: border-box;
      border: 6px solid #38bdf8;
      background: #111820;
      box-shadow: 0 18px 40px rgba(0, 0, 0, 0.45);
    }
    .webcam img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center top;
    }
  </style>
</head>
<body>
  <section class="title-wrap">
    <p class="eyebrow">YouTube</p>
    <h1>{{title}}</h1>
    <div class="rule"></div>
  </section>
  <aside class="webcam">
    <img src="{{frame_src}}" alt="">
  </aside>
</body>
</html>
