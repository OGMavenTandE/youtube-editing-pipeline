<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>slide</title>
  <style>
    html, body {
      width: 1920px;
      height: 1080px;
      margin: 0;
      overflow: hidden;
      font-family: "DejaVu Sans", "Segoe UI", Arial, sans-serif;
      color: #f4f7fb;
    }
    body.pip_list, body.pip_claim {
      background: #0b1016;
    }
    body.split, body.lower_third {
      background: transparent;
    }
    .safe {
      position: absolute;
      left: 96px;
      top: 88px;
      width: 1180px;
      height: 620px;
    }
    body.split .safe,
    body.lower_third .safe {
      display: none;
    }
    .split-band {
      display: none;
    }
    body.split .split-band {
      display: block;
      position: absolute;
      left: 0;
      top: 720px;
      width: 1920px;
      height: 360px;
      background: #0b1016;
      box-sizing: border-box;
      border-top: 6px solid #38bdf8;
      padding: 36px 80px 32px;
    }
    .pip-pocket {
      display: none;
    }
    body.pip_list .pip-pocket,
    body.pip_claim .pip-pocket {
      display: block;
      position: absolute;
      right: 40px;
      bottom: 36px;
      width: 560px;
      height: 400px;
    }
    h1 {
      margin: 0 0 28px;
      font-size: 72px;
      line-height: 1.12;
      letter-spacing: -0.02em;
      font-weight: 700;
    }
    body.pip_claim h1 {
      font-size: 84px;
      max-width: 1100px;
    }
    body.split h1 {
      margin: 0 0 16px;
      font-size: 52px;
    }
    .lede {
      margin: 0;
      font-size: 40px;
      line-height: 1.35;
      color: #d5dee7;
    }
    ul {
      margin: 0;
      padding: 0;
      list-style: none;
    }
    li {
      position: relative;
      margin: 0 0 18px;
      padding-left: 36px;
      font-size: 40px;
      line-height: 1.3;
    }
    li::before {
      content: "";
      position: absolute;
      left: 0;
      top: 0.55em;
      width: 12px;
      height: 12px;
      border-radius: 50%;
      background: #38bdf8;
    }
    body.split li {
      font-size: 32px;
      margin-bottom: 10px;
    }
    .lower-third {
      display: none;
    }
    body.lower_third .lower-third {
      display: flex;
      flex-direction: column;
      justify-content: center;
      position: absolute;
      left: 80px;
      bottom: 96px;
      width: 1200px;
      min-height: 132px;
      box-sizing: border-box;
      padding: 22px 36px 22px 40px;
      border-radius: 16px;
      background: rgba(12, 12, 16, 0.92);
      border-left: 10px solid #38bdf8;
    }
    .lower-third strong {
      font-size: 42px;
      line-height: 1.15;
    }
    .lower-third span {
      margin-top: 6px;
      font-size: 26px;
      color: #9aa8b5;
    }
  </style>
</head>
<body class="{{variant}}">
  <main class="safe">
    {{title_block}}
    {{body}}
  </main>
  <section class="split-band">
    {{title_block}}
    {{body}}
  </section>
  <aside class="pip-pocket" aria-hidden="true"></aside>
  <footer class="lower-third">
    <strong>{{lt_title}}</strong>
    <span>{{lt_sub}}</span>
  </footer>
</body>
</html>
