name: ytp

on:
  pull_request:
  push:
    branches:
      - "cursor/**"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Install Python packages
        run: |
          python -m pip install --upgrade pip
          pip install pyyaml pytest ruff

      - name: Lint
        run: python -m ruff check ytp tests/ytp

      - name: Test
        run: python -m pytest tests/ytp -m "not whisper" --confcutdir=tests/ytp -q
