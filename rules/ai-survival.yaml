series: ai-survival
owners:
  picture: Studio
  audio: Track
  edit: Booth
  script_copy: Galley
picture:
  - id: picture-001
    text: >-
      The illustrated host is an all-white, ghost-like figure with an olive
      backward cap and an orange scarf. Never call it a "stick figure".
    source: booth-handoff-2026-10-27
    added: "2026-10-29"
  - id: picture-002
    text: >-
      No name anywhere in an AI Survival video. No name cards, no name on the
      title card, and no name on the end card.
    source: booth-handoff-2026-10-27
    added: "2026-10-29"
  - id: picture-003
    text: >-
      The picture track is chapter cards and stills cut to the voice, not a
      generated talking-head film.
    source: booth-handoff-2026-10-27
    added: "2026-10-29"
  - id: picture-004
    text: >-
      Desk videos (Skynet, Autonomy Capital) are a different picture from
      AI Survival. Scott is on camera, face picture-in-picture lower right is
      required, and full-frame DVIDS B-roll carries number and data cards.
      No text-on-black cards.
    source: booth-handoff-2026-10-27
    added: "2026-10-29"
  - id: picture-005
    text: >-
      B-roll is DVIDS first, searched by named platforms, exercises, and units
      (Sea Hunter, XQ-58A, Task Force 59, Project Convergence, Vigilant Hammer),
      never abstract terms. NASA public-domain is second. Never use "DCS",
      "Flight Simulator", or "Unreal" showcases, generic stock HUD, or
      copyrighted movie clips. Spoken film titles are allowed. Choose each
      shot after the cut, tightly matched to its spoken beat.
    source: booth-handoff-2026-10-27
    added: "2026-10-29"
  - id: picture-006
    text: >-
      Shorts are 1080x1920, under 3 minutes, and aim under about 30 seconds.
      The first frame is a 3 second hook. Title text is bold. The ffmpeg
      drawtext font path must contain no commas; copy the font to a temp file
      such as bold.ttf before drawing.
    source: booth-handoff-2026-10-27
    added: "2026-10-29"
  - id: picture-007
    text: >-
      Thumbnails carry one big idea, in three words or less, readable when
      small. Thumbnail text adds what the title does not already say.
    source: booth-handoff-2026-10-27
    added: "2026-10-29"
audio:
  - id: audio-001
    text: >-
      Record audio first and cut pictures to the voice. Track owns voice
      generation (ElevenLabs voice "Rafaga", model eleven_v4) and the mix.
      Booth calls Track's existing mix scripts unchanged.
    source: booth-handoff-2026-10-27
    added: "2026-10-29"
  - id: audio-002
    text: >-
      The Rafaga voice runs at 175 to 185 words per minute. Use pauses to
      slow it down.
    source: rules-seed-2026-10-27
    added: "2026-10-29"
  - id: audio-003
    text: >-
      Voice integrated loudness is -16 LUFS. Music sits about 17 dB under the
      voice. True peak is at or below -1.5 dBTP. Shorts are -14 LUFS.
    source: rules-seed-2026-10-27
    added: "2026-10-29"
  - id: audio-004
    text: >-
      Never use a "buzz-style" sound effect. Robot sounds are original, in a
      Terminator, Star Wars, or I, Robot style, and are never a "film clip".
    source: rules-seed-2026-10-27
    added: "2026-10-29"
  - id: audio-005
    text: >-
      Start narration cuts slightly early. Check the transcript across every
      edit so no word fragments remain.
    source: rules-seed-2026-10-27
    added: "2026-10-29"
  - id: audio-006
    text: Cut coughs and stumbles out of desk takes.
    source: booth-handoff-2026-10-27
    added: "2026-10-29"
  - id: audio-007
    text: >-
      The automatic check calls Track's existing mix scripts as-is for levels
      and pace. Do not reimplement them.
    source: rules-seed-2026-10-27
    added: "2026-10-29"
edit:
  - id: edit-001
    text: >-
      When removing a sentence, remove all of it. Check the transcript around
      every splice. Episode 1 v8 shipped a stray "if" left from a partial cut.
    source: booth-handoff-2026-10-27
    added: "2026-10-29"
  - id: edit-002
    text: Rebuild from the current mix. Never splice an old render.
    source: booth-handoff-2026-10-27
    added: "2026-10-29"
  - id: edit-003
    text: >-
      Never name or criticize an AI vendor on camera (Grok, Google, Anthropic,
      ChatGPT, OpenAI, Claude, Gemini, Copilot, Meta AI, Llama, Mistral, xAI,
      DeepSeek, Perplexity). Say "some vendors" instead.
    source: scott-2026-10-29
    added: "2026-10-29"
  - id: edit-004
    text: >-
      Draft only. Bots never publish a video and never change the YouTube
      listing.
    source: booth-handoff-2026-10-27
    added: "2026-10-29"
script_copy:
  - id: script_copy-001
    text: >-
      The opening follows the 4P hook: Promise, Proof, Plan, Persona. Aim for
      the first 20 seconds. The outer window is the first 30 seconds.
    source: booth-handoff-2026-10-27
    added: "2026-10-29"
  - id: script_copy-002
    text: >-
      For the institution, say "Department of War". Never say "Department of
      Defense" or "DoD" for the institution. The first mention uses the long
      name, then "also known as", then the short form. The bio line is the
      exception and stays word for word, including the word Pentagon.
    source: booth-handoff-2026-10-27
    added: "2026-10-29"
  - id: script_copy-003
    text: >-
      Bio line, word for word. First person: "I manage AI test and evaluation
      programs for the Pentagon". Third person: "He manages AI test and
      evaluation programs for the Pentagon". Never say "former". Never say
      "Pentagon AI Tester". The 2026-10-27 seed line "a former Pentagon AI
      test and evaluation program manager" is withdrawn. As of 2026-10-29
      Scott still does this work for CDAO. Only Project Maven ended.
    source: booth-handoff-2026-10-29
    added: "2026-10-29"
  - id: script_copy-004
    text: Numbers in narration are written as words.
    source: rules-seed-2026-10-27
    added: "2026-10-29"
  - id: script_copy-005
    text: >-
      No overclaiming in titles or captions. Credit a claim that is not ours
      to its source.
    source: rules-seed-2026-10-27
    added: "2026-10-29"
  - id: script_copy-006
    text: No em dashes and no emojis in scripts, titles, captions, or descriptions.
    source: rules-seed-2026-10-27
    added: "2026-10-29"
  - id: script_copy-007
    text: >-
      On-screen text fits its box with padding. Shorten anything that lands
      within about 10 percent of the edge.
    source: rules-seed-2026-10-27
    added: "2026-10-29"
  - id: script_copy-008
    text: The channel handle is "@scott_mastin". Never write "@scottmastin".
    source: booth-handoff-2026-10-27
    added: "2026-10-29"
  - id: script_copy-009
    text: >-
      The description credit is one line only: "B-roll from DVIDS". No shot
      list in the description.
    source: booth-handoff-2026-10-27
    added: "2026-10-29"
  - id: script_copy-010
    text: >-
      Descriptions frame the series as a fictional scenario, not safety advice.
    source: rules-seed-2026-10-27
    added: "2026-10-29"
  - id: script_copy-011
    text: >-
      No like, subscribe, or comment closers, and no slogans or cue-card
      commands. Never say "like and subscribe".
    source: booth-handoff-2026-10-27
    added: "2026-10-29"
  - id: script_copy-012
    text: Draft only. Never publish and never change the YouTube listing.
    source: booth-handoff-2026-10-27
    added: "2026-10-29"
lint:
  banned_phrases:
    - stick figure
    - "@scottmastin"
    - former
    - Pentagon AI Tester
    - like and subscribe
    - Department of Defense
    - DoD
  vendors:
    say_instead: some vendors
    names:
      - Grok
      - Google
      - Anthropic
      - ChatGPT
      - OpenAI
      - Claude
      - Gemini
      - Copilot
      - Meta AI
      - Llama
      - Mistral
      - xAI
      - DeepSeek
      - Perplexity
  banned_sounds:
    - buzz
    - buzz-style
    - film clip
    - film-clip
    - star wars
    - star-wars
    - terminator
    - "i, robot"
    - i-robot
    - lightsaber
    - imperial-march
  wpm:
    min: 175
    max: 185
  loudness:
    voice_lufs: -16
    shorts_lufs: -14
    true_peak_dbtp: -1.5
    music_under_voice_db: 17
    music_tolerance_db: 3
    lufs_tolerance: 1
  ban_em_dash: true
  ban_emoji: true
  splice_window_seconds: 0.5
